<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>You’re invited to Kimiya</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f7f8fa;
      font-family: Inter, Arial, sans-serif;
      color: #202128;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 48px 20px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              background: #fff;
              border: 1px solid #e5e6ea;
              border-radius: 12px;
            "
          >
            <tr>
              <td style="padding: 36px">
                <p style="margin: 0 0 32px; font-size: 20px; font-weight: 600">
                  kimiya
                </p>
                <h1 style="margin: 0 0 16px; font-size: 24px">
                  You’re invited to Kimiya
                </h1>
                <p style="font-size: 15px; line-height: 1.6; color: #646771">
                  Follow this secure link to accept your account invitation.
                </p>
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    margin: 20px 0;
                    padding: 12px 20px;
                    background: #535fc8;
                    color: #fff;
                    border-radius: 6px;
                    text-decoration: none;
                    font-size: 14px;
                    font-weight: 600;
                  "
                  >Continue to Kimiya</a
                >
                <p style="font-size: 12px; line-height: 1.6; color: #646771">
                  This link can only be used once. If you didn’t request it, you
                  can ignore this email.
                </p>
                <p style="font-size: 12px; line-height: 1.6; color: #646771">
                  Button not working? Copy this URL into your browser:<br /><a
                    href="{{ .ConfirmationURL }}"
                    style="color: #535fc8; word-break: break-all"
                    >{{ .ConfirmationURL }}</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
